<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pour Mat">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a0f17'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23e3b96a'%3E%E2%99%A5%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<title>Le calendrier de Mat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito+Sans:wght@400;600;700&family=Caveat:wght@500;700&family=Fredoka:wght@600&display=swap">
<style>
/* Layout : nuit d'hiver couleur bordeaux, 24 portes dorées en grille, une fenêtre qui s'ouvre au centre */
:root{
  --nuit:#2a0f17;        /* fond bordeaux très sombre */
  --nuit-2:#3d1521;      /* portes */
  --nuit-3:#541d2d;      /* portes survol */
  --or:#e3b96a;          /* or doux */
  --or-pale:#f3dcae;
  --rose:#f0a3b0;        /* touche romantique */
  --papier:#fbf3e8;      /* intérieur des cases */
  --encre:#3a1a22;
  --encre-douce:#7a5560;
  --sapin:#2f5a47;
  --f-titre:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --f-texte:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-main:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--nuit);color:var(--or-pale)}
body{font-family:var(--f-texte);font-size:16px;line-height:1.55;min-height:100vh;
  background:radial-gradient(ellipse 120% 60% at 50% 0%, #4a1826 0%, var(--nuit) 60%) fixed, var(--nuit);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow-x:hidden}
#neige{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}

.apercu{background:var(--or);color:var(--encre);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;text-align:center}

header{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.sur-titre{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);font-weight:700}
h1{font-family:var(--f-titre);font-weight:600;font-style:italic;font-size:clamp(40px,9vw,68px);line-height:1;margin:0;color:var(--or-pale);text-wrap:balance}
h1 span{color:var(--or)}
.compte{font-family:var(--f-main);font-size:clamp(22px,5vw,28px);color:var(--or);margin:4px 0 0}
.trajet{display:flex;align-items:center;gap:10px;width:min(100%,420px);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-douce)}
.trajet .barre{flex:1;height:4px;border-radius:4px;background:var(--nuit-3);position:relative;overflow:hidden}
.trajet .barre i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--rose),var(--or));border-radius:4px}
.trajet b{color:var(--or-pale);font-weight:700}

/* Guirlande */
.guirlande{position:relative;height:34px;margin:-28px calc(-1 * max(16px, env(safe-area-inset-left,0px))) -10px;overflow:hidden;
  background:radial-gradient(circle at 50% -40%,transparent 62%,#c9a65e 63%,#c9a65e 66%,transparent 67%) 0 0/60px 34px repeat-x}
.guirlande i{position:absolute;top:16px;width:10px;height:14px;border-radius:50% 50% 45% 45%;animation:clignote 2.6s ease-in-out infinite}
.guirlande i:nth-child(even){animation-delay:1.3s}
@keyframes clignote{50%{opacity:.45}}

.grille{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px;row-gap:10px}
@media(min-width:620px){.grille{grid-template-columns:repeat(6,minmax(0,1fr));column-gap:22px;row-gap:16px}}

/* Une case = une forme (cadeau, boule, enveloppe, maison) + sa date */
.porte{position:relative;background:none;border:0;padding:16px 0 0;font:inherit;cursor:pointer;color:inherit;
  display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .25s ease}
.porte:focus-visible{outline:2px solid var(--or);outline-offset:4px;border-radius:12px}
.porte .date{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#c98d9a;white-space:nowrap}
.forme{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;transition:transform .25s ease, box-shadow .25s, filter .25s}
.num{position:relative;z-index:2;font-family:"Fredoka", var(--f-texte);font-weight:600;line-height:1}
.porte:hover .forme{transform:translateY(-3px)}
.porte.verrou{cursor:default}
.porte.verrou .forme{filter:saturate(.7) brightness(.86)}
.porte.verrou .date{color:#a77583}
.porte.aujourdhui .forme{animation:pulse 2.4s ease-in-out infinite}
.porte.aujourdhui .date{color:var(--or)}
.porte.secoue .forme{animation:secoue .4s}
@keyframes pulse{0%,100%{transform:scale(1.04);filter:drop-shadow(0 0 8px rgba(243,199,106,.55))}50%{transform:scale(1.09);filter:drop-shadow(0 0 18px rgba(243,199,106,.9))}}
@keyframes secoue{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.ouverte .num.coeur{font-size:0}
.ouverte .num.coeur::after{content:"♥";font-size:22px}

/* Cadeau */
.cadeau{border-radius:8px;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18),0 10px 22px rgba(0,0,0,.22)}
.cadeau::before{content:"";position:absolute;inset:0;border-radius:10px;background:
  linear-gradient(90deg,transparent 44%,rgba(251,243,232,.8) 44%,rgba(251,243,232,.8) 56%,transparent 56%),
  linear-gradient(transparent 44%,rgba(251,243,232,.8) 44%,rgba(251,243,232,.8) 56%,transparent 56%)}
.cadeau .noeud{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:42px;height:21px;z-index:1}
.cadeau .num{width:40px;height:40px;border-radius:50%;background:var(--papier);color:#6b2436;display:grid;place-items:center;font-family:var(--f-titre);font-weight:600;font-size:23px;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.ouverte .cadeau{background:rgba(251,243,232,.06);box-shadow:inset 0 0 0 1.5px rgba(227,185,106,.6)}
.ouverte .cadeau::before,.ouverte .cadeau .noeud{display:none}
.ouverte .cadeau .num{background:var(--rose);color:#5a1a2a}

/* Boule */
.boule{border-radius:50%;width:88%;margin-top:4px;background:radial-gradient(circle at 32% 28%,var(--c2),var(--c) 45%,var(--c3));box-shadow:0 8px 16px rgba(0,0,0,.3)}
.boule::before{content:"";position:absolute;top:-34px;left:50%;width:1.5px;height:24px;background:#c9a65e}
.boule::after{content:"";position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:28%;height:12px;border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#9b7a35,#f3d48a,#9b7a35)}
.boule .num{color:#fff;font-size:26px;text-shadow:0 2px 4px rgba(0,0,0,.25)}

/* Enveloppe */
.enveloppe{aspect-ratio:5/4;margin-top:10px;border-radius:6px;background:var(--c);box-shadow:0 6px 14px rgba(0,0,0,.28)}
.enveloppe::before{content:"";position:absolute;inset:0 0 auto 0;height:58%;background:var(--c3);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0;transform-origin:top;transition:transform .4s}
.enveloppe::after{content:"";position:absolute;inset:0;border-radius:6px;opacity:.6;background:
  linear-gradient(to top right,transparent 49.4%,var(--c3) 50%,transparent 50.8%) left bottom/50% 100% no-repeat,
  linear-gradient(to top left,transparent 49.4%,var(--c3) 50%,transparent 50.8%) right bottom/50% 100% no-repeat}
.enveloppe .num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#e0566f,#a3203a 70%);color:#fde9e4;font-family:var(--f-titre);font-style:italic;font-size:22px;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.ouverte .enveloppe::before{transform:scaleY(-1)}
.ouverte .enveloppe .num{background:#fff;color:#c2354f}

/* Maison en pain d'épices */
.maison{width:90%;margin-top:14px;aspect-ratio:1/.95;border-radius:4px 4px 6px 6px;background:var(--c);box-shadow:0 4px 0 #8a4f22}
.maison .toit{position:absolute;left:-12%;right:-12%;top:-44%;height:48%;background:#e2564f;clip-path:polygon(50% 0,100% 100%,0 100%)}
.maison .neige{position:absolute;left:-7%;right:-7%;top:-6%;height:22%;background:#fff;z-index:1;
  clip-path:polygon(0 0,100% 0,100% 55%,92% 100%,84% 55%,76% 100%,68% 55%,60% 100%,52% 55%,44% 100%,36% 55%,28% 100%,20% 55%,12% 100%,4% 55%,0 70%)}
.maison .fen{position:absolute;bottom:0;left:35%;width:30%;height:34%;border-radius:10px 10px 0 0;background:#5a3015;box-shadow:inset 0 0 0 2px #f3e2d2}
.maison .num{color:#fff;font-size:21px;margin-top:-14px;text-shadow:0 1.5px 0 #7a421b}
.ouverte .maison .fen,.aujourdhui .maison .fen{background:#ffd36e;box-shadow:inset 0 0 0 2px #fff,0 0 12px #ffd36e}

.pied{text-align:center;font-family:var(--f-main);font-size:22px;color:var(--encre-douce)}

/* Fenêtre du jour */
.voile{position:fixed;inset:0;z-index:20;background:rgba(20,6,10,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;
  overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.carte{color-scheme:light;position:relative;width:100%;max-width:560px;margin-block:auto;background:var(--papier);color:var(--encre);border-radius:14px;
  padding:30px 22px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:ouvre .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ouvre{from{transform:perspective(900px) rotateY(-70deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.fermer{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--encre-douce);font-size:24px;cursor:pointer}
.fermer:focus-visible{outline:2px solid var(--encre);}
.carte .jour{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#a0485c;font-weight:700}
.carte h2{font-family:var(--f-titre);font-style:italic;font-weight:600;font-size:clamp(30px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.carte .texte{font-family:var(--f-main);font-size:24px;line-height:1.3;white-space:pre-line;margin:0;color:var(--encre)}
.carte .a-venir{font-family:var(--f-texte);font-size:14px;color:var(--encre-douce);background:#f2e4d2;border-radius:8px;padding:10px 12px;margin:0}
.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.photos figure{margin:0;background:#fff;padding:8px 8px 6px;border-radius:3px;box-shadow:0 4px 14px rgba(58,26,34,.15)}
.photos figure:nth-child(odd){transform:rotate(-1.5deg)}
.photos figure:nth-child(even){transform:rotate(1.2deg)}
.photos img{display:block;width:100%;height:auto;border-radius:2px}
.photos figcaption{font-family:var(--f-main);font-size:19px;text-align:center;color:var(--encre-douce)}
.carte video,.carte audio{width:100%;border-radius:8px}
.lien{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;background:var(--encre);color:var(--papier);text-decoration:none;padding:10px 16px;border-radius:999px;font-weight:700}
.lien:focus-visible{outline:2px solid var(--encre);outline-offset:3px}

/* Playlist */
.chansons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:ch}
.chansons li{counter-increment:ch;background:#fff;border-radius:12px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 12px rgba(58,26,34,.08)}
.ch-tete{display:flex;align-items:center;gap:12px}
.ch-tete::before{content:counter(ch);font-family:var(--f-titre);font-weight:600;font-size:26px;color:#c0465d;min-width:20px}
.ch-tete div{flex:1;min-width:0;display:flex;flex-direction:column}
.ch-tete b{font-family:var(--f-titre);font-weight:600;font-size:21px;line-height:1.1}
.ch-tete span{font-size:13px;color:var(--encre-douce)}
.ecouter{flex:none;font-size:13px;font-weight:700;text-decoration:none;color:#fff;background:#7a2a3c;border-radius:999px;padding:7px 12px}
.ecouter:focus-visible{outline:2px solid var(--encre);outline-offset:2px}
.chansons p{margin:0;font-family:var(--f-main);font-size:21px;line-height:1.22}
.chansons video{width:min(100%,300px);align-self:center;border-radius:12px;background:#000}

/* Album photo */
.album{display:flex;flex-direction:column;gap:26px;align-items:center;padding:4px 0 8px}
.album figure{margin:0;width:min(100%,330px);background:#fff;padding:10px 10px 14px;border-radius:3px;box-shadow:0 6px 18px rgba(58,26,34,.18);display:flex;flex-direction:column;gap:10px}
.album figure:nth-child(odd){transform:rotate(-1.6deg)}
.album figure:nth-child(even){transform:rotate(1.4deg)}
.album img{display:block;width:100%;height:auto;border-radius:2px}
.album figcaption{font-family:var(--f-main);font-size:21px;line-height:1.2;color:var(--encre);padding:0 4px}

/* Frise des premiers échanges */
.etapes{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:26px;position:relative}
.etapes::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:repeating-linear-gradient(#e3b9a0 0 6px,transparent 6px 11px)}
.etapes li{position:relative;display:flex;flex-direction:column;gap:8px}
.etapes li::before{content:"♥";position:absolute;left:-25px;top:-1px;font-size:15px;color:#c0465d;background:var(--papier);line-height:1.2}
.etape-tete{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.etape-tete b{font-family:var(--f-titre);font-weight:600;font-size:22px}
.etape-tete span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a0485c}
.etapes p{margin:0;font-family:var(--f-main);font-size:22px;line-height:1.25}
.etapes img{display:block;width:min(100%,300px);height:auto;border-radius:16px;box-shadow:0 8px 22px rgba(58,26,34,.22)}

/* Enveloppe (lettre / fleurs / chocolat) */
.colis{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.colis .icone{font-size:64px;line-height:1}
.colis p{margin:0;text-align:center;font-family:var(--f-main);font-size:26px;line-height:1.25}

/* Quiz */
.quiz{display:flex;flex-direction:column;gap:12px}
.quiz .q{font-family:var(--f-titre);font-weight:600;font-size:24px;line-height:1.2;margin:0}
.quiz .compteur{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--encre-douce)}
.choix{display:flex;flex-direction:column;gap:8px}
.choix button{font:inherit;text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid #e3cdb8;background:#fff;color:var(--encre);cursor:pointer}
.choix button:hover{border-color:#a0485c}
.choix button.bon{background:#e5f0e9;border-color:var(--sapin)}
.choix button.faux{background:#f9e1e4;border-color:#c0596d}
.choix button{display:flex;gap:10px;align-items:center}
.choix .case{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid #c9a99a;background:#fff;display:grid;place-items:center;font-size:12px;color:#fff}
.choix button.coche{border-color:#a0485c;background:#fff6f4}
.choix button.coche .case{background:#a0485c;border-color:#a0485c}
.choix button.coche .case::after,.choix button.bon .case::after{content:"✓"}
.choix button.bon .case{background:var(--sapin);border-color:var(--sapin)}
.choix button.bon{background:#e5f0e9;border-color:var(--sapin)}
.choix button.faux{background:#f9e1e4;border-color:#c0596d;text-decoration:line-through}
.verdict{margin:0;font-weight:700;font-size:15px;color:#7a2a3c}
.reponse{font-family:var(--f-main);font-size:22px;line-height:1.25;margin:0;color:#7a2a3c}
.btn{align-self:flex-start;font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:#7a2a3c;color:#fff;cursor:pointer}
.btn:focus-visible,.choix button:focus-visible{outline:2px solid var(--encre);outline-offset:2px}

/* Puzzle */
.puzzle{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;background:#e3cdb8;padding:3px;border-radius:6px}
.puzzle button{border:0;padding:0;background-repeat:no-repeat;background-size:300% 300%;cursor:pointer;border-radius:2px}
.puzzle button.choisi{outline:3px solid #a0485c;outline-offset:-3px}
.puzzle.fini{gap:0;padding:0;transition:gap .4s}
.aide{font-size:14px;color:var(--encre-douce);margin:0;text-align:center}

/* Raisons */
.raisons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.raisons li{counter-increment:r;font-family:var(--f-main);font-size:23px;line-height:1.25;display:flex;gap:10px;animation:apparait .5s ease}
.raisons li::before{content:counter(r);font-family:var(--f-titre);font-weight:600;font-size:18px;color:#a0485c;min-width:24px;padding-top:4px}
@keyframes apparait{from{opacity:0;transform:translateY(6px)}}

/* Bon pour */
.bon-pour{border:2px dashed #a0485c;border-radius:12px;padding:20px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;background:#fff8f1}
.bon-pour .tag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#a0485c;font-weight:700}
.bon-pour .quoi{font-family:var(--f-titre);font-style:italic;font-weight:600;font-size:30px;line-height:1.1}
.bon-pour .valid{font-size:13px;color:var(--encre-douce)}

/* Choix du bon */
.choix-bon{display:flex;flex-direction:column;gap:12px}
.cb-titre{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#a0485c}
.cb-options{display:flex;flex-direction:column;gap:8px}
.cb-option{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid #ecd9c6;border-radius:12px;padding:12px 14px;cursor:pointer}
.cb-option.actif{border-color:#a0485c;background:#fff6f4}
.cb-option input{accent-color:#a0485c;margin-top:4px;flex:none}
.cb-option span{display:flex;flex-direction:column;gap:2px}
.cb-option b{font-family:var(--f-titre);font-weight:600;font-size:20px;line-height:1.15}
.cb-option small{font-size:14px;color:var(--encre-douce);line-height:1.4}
.cb-perso{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:12px;padding:12px 14px}
.cb-zones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.cb-zone,.cb-huile label{display:flex;gap:8px;align-items:center;font-size:15px;cursor:pointer}
.cb-zone input,.cb-huile input{accent-color:#a0485c;width:18px;height:18px}
.cb-totale{grid-column:1/-1;font-weight:700;color:#7a2a3c;padding-top:6px;border-top:1px dashed #ecd9c6}
.cb-huile{display:flex;gap:18px;padding-top:6px;border-top:1px dashed #ecd9c6}
.cb-envoi{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cb-envoi pre{margin:0;width:100%;white-space:pre-wrap;font-family:var(--f-main);font-size:21px;line-height:1.25;background:#f2e4d2;border-radius:10px;padding:10px 12px;user-select:text}
.cb-envoi .btn{text-decoration:none}
.cb-copier{font:inherit;font-size:14px;font-weight:700;background:none;border:0;color:#7a2a3c;text-decoration:underline;cursor:pointer;padding:0}

/* Final */
.rebours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.rebours div{background:#7a2a3c;color:#fff;border-radius:10px;padding:10px 4px}
.rebours b{display:block;font-family:var(--f-titre);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}

/* ============================================================ */
const PARIS = new Date("2026-12-20T00:00:00");
const APERCU = location.hash === "#apercu-noel";
const JOURS_FR = ["dim","lun","mar","mer","jeu","ven","sam"];
const MOIS_FR = ["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const pad = n => String(n).padStart(2,"0");
const aujourdHui = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const enDate = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const ouvertes = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem("mat-ouvertes")||"[]")); }catch(e){ return new Set(); } })();
const memoriser = () => { try{ localStorage.setItem("mat-ouvertes", JSON.stringify([...ouvertes])); }catch(e){} };
const echap = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById("apercu").hidden = !APERCU;

function enTete(){
  const j = Math.ceil((PARIS - enDate(aujourdHui())) / 864e5);
  const el = document.getElementById("compte");
  el.textContent = j > 1 ? `Plus que ${j} dodos avant Paris` : j === 1 ? "Demain, Paris ♥" : "On est ensemble ♥";
  const total = (PARIS - enDate("2026-11-26")) / 864e5;
  const pct = Math.min(100, Math.max(0, (total - Math.max(j,0)) / total * 100));
  document.getElementById("barre").style.width = pct + "%";
}

function grille(){
  const g = document.getElementById("grille"); g.innerHTML = "";
  const auj = aujourdHui();
  JOURS.forEach((jour,i)=>{
    const d = enDate(jour.date);
    const dispo = APERCU || jour.date <= auj;
    const b = document.createElement("button");
    b.className = "porte" + (dispo ? "" : " verrou") + (jour.date===auj ? " aujourdhui" : "") + (ouvertes.has(jour.date) ? " ouverte" : "");
    b.innerHTML = forme(jour,i) + `<span class="date">${JOURS_FR[d.getDay()]} ${d.getDate()} ${MOIS_FR[d.getMonth()]}</span>`;
    b.setAttribute("aria-label", `Jour ${i+1}, ${d.getDate()} ${MOIS_FR[d.getMonth()]}` + (dispo ? "" : ", pas encore disponible"));
    b.addEventListener("click", ()=>{
      if(!dispo){
        b.classList.remove("secoue"); void b.offsetWidth; b.classList.add("secoue");
        const n = Math.round((d - enDate(auj)) / 864e5);
        b.querySelector(".date").textContent = n===1 ? "demain !" : `dans ${n} jours`;
        return;
      }
      ouvrir(jour, i, b);
    });
    g.appendChild(b);
  });
}

const FORMES = ["cadeau","boule","enveloppe","maison"];
const COUL = {
  cadeau:[{c:"#d98b92"},{c:"#9fc2aa"},{c:"#f1c6cd"},{c:"#ead49b"}],
  boule:[{c:"#ef8fa6",c2:"#ffd9e2",c3:"#b44f6b"},{c:"#e2ae45",c2:"#fff1c4",c3:"#9b6d18"},{c:"#5f9e78",c2:"#d6f0dc",c3:"#2c5a41"},{c:"#d23a55",c2:"#ff9aa8",c3:"#8e1730"}],
  enveloppe:[{c:"#fbe3dc",c3:"#efc2bd"},{c:"#f7d0cf",c3:"#e9b0ad"}],
  maison:[{c:"#c47a3f"},{c:"#b56d36"}]
};
function quelleForme(jour,i){
  return "cadeau";
}
function forme(jour,i){
  const f = quelleForme(jour,i), pal = COUL[f][(i + Math.floor(i/4)) % COUL[f].length];
  const vars = Object.entries(pal).map(([k,v])=>`--${k}:${v}`).join(";");
  const ouverte = ouvertes.has(jour.date);
  let deco = "", coeur = ouverte && f!=="maison" ? " coeur" : "";
  if(f==="cadeau") deco = `<svg class="noeud" viewBox="0 0 40 20" aria-hidden="true"><path d="M20 12 C10 -2 0 4 6 12 C10 17 16 14 20 12 C24 14 30 17 34 12 C40 4 30 -2 20 12Z" fill="#fbf3e8" stroke="#e3cdb8" stroke-width="1.2"/><circle cx="20" cy="12" r="3.6" fill="#f0dcc4"/></svg>`;
  if(f==="maison") deco = `<span class="toit"></span><span class="neige"></span><span class="fen"></span>`;
  return `<span class="forme ${f}" style="${vars}">${deco}<span class="num${coeur}">${ouverte && f==="maison" ? "♥ " : ""}${i+1}</span></span>`;
}

let dernierBouton = null, minuterie = null;
function ouvrir(jour, i, bouton){
  dernierBouton = bouton;
  ouvertes.add(jour.date); memoriser();
  const d = enDate(jour.date);
  const v = document.getElementById("voile");
  let h = `<div class="carte" role="dialog" aria-modal="true" aria-labelledby="titre-jour">
    <button class="fermer" aria-label="Fermer">×</button>
    <div class="jour">Jour ${i+1} · ${JOURS_FR[d.getDay()]} ${d.getDate()} ${MOIS_FR[d.getMonth()]}</div>
    <h2 id="titre-jour">${echap(jour.titre)}</h2>`;
  const icones = {lettre:"💌", fleurs:"💐", chocolat:"🍫"};
  if(icones[jour.type]){
    h += `<div class="colis"><div class="icone">${icones[jour.type]}</div><p>${echap(jour.texte)}</p></div>`;
  } else if(jour.texte){
    h += `<p class="texte">${echap(jour.texte)}</p>`;
  }
  if(jour.etapes?.length){
    h += `<ol class="etapes">` + jour.etapes.map(e=>`<li><div class="etape-tete"><b>${echap(e.app)}</b><span>${echap(e.date)}</span></div><p>${echap(e.texte)}</p><img src="${echap(e.src)}" alt="Capture ${echap(e.app)}" loading="lazy"></li>`).join("") + `</ol>`;
  }
  if(jour.chansons?.length){
    h += `<ol class="chansons">` + jour.chansons.map(c=>`<li><div class="ch-tete"><div><b>${echap(c.titre)}</b><span>${echap(c.artiste)}</span></div><a class="ecouter" href="https://www.deezer.com/search/${encodeURIComponent(c.titre+" "+c.artiste.split(",")[0])}" target="_blank" rel="noopener">▶ Écouter</a></div><p>${echap(c.mot)}</p>${c.video?`<video controls playsinline preload="metadata" src="${echap(c.video)}"></video>`:""}</li>`).join("") + `</ol>`;
  }
  if(jour.album?.length){
    h += `<div class="album">` + jour.album.map(p=>`<figure><img src="${echap(p.src)}" alt="" loading="lazy"><figcaption>${echap(p.legende)}</figcaption></figure>`).join("") + `</div>`;
  }
  if(jour.photos?.length){
    h += `<div class="photos">` + jour.photos.map(p=>`<figure><img src="${echap(p.src)}" alt="${echap(p.legende||"Photo")}" loading="lazy">${p.legende?`<figcaption>${echap(p.legende)}</figcaption>`:""}</figure>`).join("") + `</div>`;
  }
  if(jour.video) h += `<video controls playsinline preload="metadata" src="${echap(jour.video)}"></video>`;
  if(jour.audio) h += `<audio controls preload="metadata" src="${echap(jour.audio)}"></audio>`;
  if(jour.lien?.url) h += `<a class="lien" href="${echap(jour.lien.url)}" target="_blank" rel="noopener">${echap(jour.lien.texte||"Ouvrir")}</a>`;
  if(jour.type==="quiz") h += `<div class="quiz" id="quiz"></div>`;
  if(jour.type==="puzzle") h += `<div class="puzzle" id="puzzle" style="aspect-ratio:${jour.ratio||"1"}"></div><p class="aide" id="aide-puzzle">Touche deux morceaux pour les échanger</p>`;
  if(jour.type==="raisons") h += `<ol class="raisons" id="raisons"></ol><button class="btn" id="raison-suivante">Une raison ♥</button>`;
  if(jour.type==="bon"){
    h += `<div class="bon-pour"><span class="tag">Bon pour</span><span class="quoi">${echap(jour.quoi)}</span><span class="valid">${echap(jour.valable)}</span></div>`;
    if(jour.options) h += `<div class="choix-bon" id="choix-bon"></div>`;
    else h += `<p class="aide">Fais une capture d'écran et garde-la précieusement.</p>`;
  }
  if(jour.type==="final") h += `<div class="rebours" id="rebours"></div>`;
  if(APERCU && jour.brouillon) h += `<p class="a-venir">Brouillon : contenu à compléter.</p>`;
  h += `</div>`;
  v.innerHTML = h; v.hidden = false;
  document.body.style.overflow = "hidden";
  v.querySelector(".fermer").addEventListener("click", fermer);
  v.querySelector(".fermer").focus();
  if(jour.type==="quiz") quiz(jour);
  if(jour.type==="bon" && jour.options) choixBon(jour);
  if(jour.type==="puzzle") puzzle(jour);
  if(jour.type==="raisons") raisons(jour);
  if(jour.type==="final") rebours();
  if(jour.type==="final" || jour.type==="fleurs") confettis();
}
function fermer(){
  const v = document.getElementById("voile");
  v.hidden = true; v.innerHTML = ""; document.body.style.overflow = "";
  clearInterval(minuterie);
  grille();
}
document.getElementById("voile").addEventListener("click", e=>{ if(e.target.id==="voile") fermer(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !document.getElementById("voile").hidden) fermer(); });

function choixBon(jour){
  const z = document.getElementById("choix-bon"), cle = "mat-bon-"+jour.date;
  let etat = {option:null, zones:[], huile:"Avec huile"};
  try{ etat = Object.assign(etat, JSON.parse(localStorage.getItem(cle)||"{}")); }catch(e){}
  const garder = ()=>{ try{ localStorage.setItem(cle, JSON.stringify(etat)); }catch(e){} };
  const resume = ()=>{
    const o = jour.options.find(x=>x.id===etat.option);
    let t = `Mon bon massage : ${o.titre} (1 heure)`;
    if(o.id==="perso") t += `\nZones : ${etat.zones.length===jour.zones.length?"la totale 😏":etat.zones.length?etat.zones.join(", "):"à toi de voir"}\n${etat.huile}`;
    return t;
  };
  const dessine = ()=>{
    let h = `<p class="cb-titre">Ton choix</p><div class="cb-options">` + jour.options.map(o=>`
      <label class="cb-option${etat.option===o.id?" actif":""}"><input type="radio" name="massage" id="m-${o.id}" value="${o.id}"${etat.option===o.id?" checked":""}>
      <span><b>${echap(o.titre)}</b><small>${echap(o.desc)}</small></span></label>`).join("") + `</div>`;
    if(etat.option==="perso"){
      h += `<div class="cb-perso"><p class="cb-titre">Les zones que tu veux</p><div class="cb-zones">` + jour.zones.map((zn,k)=>`
        <label class="cb-zone"><input type="checkbox" id="zone-${k}" value="${echap(zn)}"${etat.zones.includes(zn)?" checked":""}> ${echap(zn)}</label>`).join("") +
        `<label class="cb-zone cb-totale"><input type="checkbox" id="zone-totale"${etat.zones.length===jour.zones.length?" checked":""}> La totale</label></div><div class="cb-huile">` + ["Avec huile","Sans huile"].map(v=>`<label><input type="radio" name="huile" value="${v}"${etat.huile===v?" checked":""}> ${v}</label>`).join("") + `</div></div>`;
    }
    if(etat.option){
      const msg = resume();
      h += `<div class="cb-envoi"><pre>${echap(msg)}</pre>
        <a class="btn" href="https://wa.me/?text=${encodeURIComponent(msg+" 💆‍♀️")}" target="_blank" rel="noopener">Envoyer mon choix sur WhatsApp</a>
        <button class="cb-copier" type="button">Copier le texte</button></div>`;
    }
    z.innerHTML = h;
    z.querySelectorAll('input[name="massage"]').forEach(i=>i.addEventListener("change",()=>{ etat.option=i.value; garder(); dessine(); }));
    z.querySelectorAll('.cb-zone:not(.cb-totale) input').forEach(i=>i.addEventListener("change",()=>{ etat.zones = [...z.querySelectorAll('.cb-zone:not(.cb-totale) input:checked')].map(x=>x.value); garder(); dessine(); }));
    const tot = z.querySelector('#zone-totale'); if(tot) tot.addEventListener("change",()=>{ etat.zones = tot.checked ? [...jour.zones] : []; garder(); dessine(); });
    z.querySelectorAll('input[name="huile"]').forEach(i=>i.addEventListener("change",()=>{ etat.huile=i.value; garder(); dessine(); }));
    const c = z.querySelector(".cb-copier");
    if(c) c.addEventListener("click",()=>{ navigator.clipboard?.writeText(resume()).then(()=>{ c.textContent="Copié ✓"; },()=>{ c.textContent="Sélectionne le texte au-dessus"; }); });
  };
  dessine();
}

function quiz(jour){
  const z = document.getElementById("quiz"); let n = 0, score = 0;
  const pose = ()=>{
    if(n >= jour.questions.length){
      const t = jour.questions.length;
      z.innerHTML = `<p class="q">${score} / ${t}</p><p class="reponse">${score===t?"Tu me connais par cœur ♥":score>=t/2?"Pas mal du tout… tu sais lire dans mes pensées ♥":"Tu sais maintenant un peu mieux ce que je pense de toi ♥"}</p>`;
      if(score===t) confettis();
      return;
    }
    const q = jour.questions[n];
    z.innerHTML = `<span class="compteur">Question ${n+1} sur ${jour.questions.length} · plusieurs réponses possibles</span><p class="q">${echap(q.q)}</p>
      <div class="choix">${q.options.map((o,k)=>`<button type="button" data-k="${k}" aria-pressed="false"><span class="case"></span>${echap(o)}</button>`).join("")}</div>
      <button class="btn" id="q-valider" type="button" disabled>Valider</button>`;
    const boutons = [...z.querySelectorAll(".choix button")], valider = z.querySelector("#q-valider");
    boutons.forEach(b=>b.addEventListener("click",()=>{
      const on = b.getAttribute("aria-pressed")!=="true";
      b.setAttribute("aria-pressed", on); b.classList.toggle("coche", on);
      valider.disabled = !boutons.some(x=>x.classList.contains("coche"));
    }));
    valider.addEventListener("click",()=>{
      const choisis = boutons.filter(x=>x.classList.contains("coche")).map(x=>+x.dataset.k);
      const juste = choisis.length===q.bonnes.length && choisis.every(k=>q.bonnes.includes(k));
      if(juste) score++;
      boutons.forEach(x=>{ const k=+x.dataset.k; x.disabled=true;
        if(q.bonnes.includes(k)) x.classList.add("bon"); else if(choisis.includes(k)) x.classList.add("faux"); });
      valider.remove();
      z.insertAdjacentHTML("beforeend", `<p class="verdict">${juste?"Bonne réponse !":"Raté…"}</p><p class="reponse">${echap(q.mot)}</p><button class="btn" id="q-suivante" type="button">${n+1<jour.questions.length?"Question suivante":"Voir mon score"}</button>`);
      document.getElementById("q-suivante").addEventListener("click",()=>{ n++; pose(); });
    });
  };
  pose();
}

function puzzle(jour){
  const p = document.getElementById("puzzle");
  let ordre = [...Array(9).keys()];
  do { ordre.sort(()=>Math.random()-.5); } while(ordre.every((v,i)=>v===i));
  let choisi = null;
  const dessine = ()=>{
    p.innerHTML = ordre.map((v,i)=>`<button data-i="${i}" aria-label="Morceau ${i+1}" style="background-image:url('${jour.image}');background-position:${(v%3)*50}% ${Math.floor(v/3)*50}%"></button>`).join("");
    p.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      const i = +b.dataset.i;
      if(choisi===null){ choisi=i; b.classList.add("choisi"); return; }
      [ordre[choisi],ordre[i]] = [ordre[i],ordre[choisi]]; choisi=null; dessine();
      if(ordre.every((v,k)=>v===k)){ p.classList.add("fini"); p.querySelectorAll("button").forEach(x=>x.disabled=true); document.getElementById("aide-puzzle").textContent="Bravo ma belle ♥"; confettis(); }
    }));
  };
  dessine();
}

function raisons(jour){
  const l = document.getElementById("raisons"), b = document.getElementById("raison-suivante"); let n = 0;
  b.addEventListener("click",()=>{
    if(n < jour.raisons.length){ l.insertAdjacentHTML("beforeend", `<li>${echap(jour.raisons[n])}</li>`); n++; }
    if(n >= jour.raisons.length){ b.textContent = "Et toutes les autres que je te dirai en vrai"; b.disabled = true; }
  });
}

function rebours(){
  const r = document.getElementById("rebours");
  const maj = ()=>{
    let s = Math.max(0, Math.floor((PARIS - new Date())/1000));
    const v = [Math.floor(s/86400), Math.floor(s%86400/3600), Math.floor(s%3600/60), s%60];
    r.innerHTML = ["jours","heures","min","sec"].map((u,k)=>`<div><b>${pad(v[k])}</b><small>${u}</small></div>`).join("");
  };
  maj(); minuterie = setInterval(maj, 1000);
}

/* Confettis en cœurs */
function confettis(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(let k=0;k<26;k++){
    const c = document.createElement("span");
    c.textContent = ["♥","✦","♥"][k%3];
    c.style.cssText = `position:fixed;z-index:30;left:${Math.random()*100}vw;top:-20px;font-size:${14+Math.random()*16}px;color:${["#f0a3b0","#e3b96a","#ffffff"][k%3]};pointer-events:none;transition:transform ${2+Math.random()*1.5}s ease-in, opacity 3.5s`;
    document.body.appendChild(c);
    requestAnimationFrame(()=>{ c.style.transform=`translate(${(Math.random()-.5)*120}px, ${innerHeight+40}px) rotate(${Math.random()*360}deg)`; c.style.opacity="0.2"; });
    setTimeout(()=>c.remove(), 4000);
  }
}

/* Neige */
(function(){
  const cv = document.getElementById("neige"), ctx = cv.getContext("2d");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H,flocons=[];
  const taille = ()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight; };
  taille(); addEventListener("resize", taille);
  for(let k=0;k<70;k++) flocons.push({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2,v:.25+Math.random()*.7,o:Math.random()*Math.PI*2});
  (function anime(){
    ctx.clearRect(0,0,W,H);
    for(const f of flocons){
      f.y+=f.v; f.o+=.01; f.x+=Math.sin(f.o)*.3;
      if(f.y>H){ f.y=-4; f.x=Math.random()*W; }
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fillStyle=`rgba(251,243,232,${.25+f.r/4})`; ctx.fill();
    }
    requestAnimationFrame(anime);
  })();
})();

enTete(); grille();
setInterval(()=>{ enTete(); }, 60000);
addEventListener("hashchange", ()=>location.reload());
</script>
